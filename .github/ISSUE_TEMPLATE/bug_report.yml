name: Bug Report
description: File a bug report to help improve Magnon
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much context as possible.
  - type: input
    id: version
    attributes:
      label: Magnon Version
      placeholder: e.g. 0.1.6
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Please provide a minimal code snippet or repository link.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Node version, Vite version.
      placeholder: |
        OS: Linux / macOS / Windows
        Node: v22.x
        Vite: v6.x
    validations:
      required: false
