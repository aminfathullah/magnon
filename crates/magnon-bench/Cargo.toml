[package]
name = "magnon-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "magnon-bench"
path = "src/main.rs"

[dependencies]
magnon-core = { path = "../magnon-core" }
oxc_allocator = "0.133.0"
oxc_parser = "0.133.0"
oxc_ast = "0.133.0"
oxc_span = "0.133.0"
oxc_semantic = "0.133.0"
oxc_transformer = "0.133.0"
oxc_codegen = "0.133.0"
rayon = "1.12.0"
mimalloc = "0.1.52"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9.11"
simdutf8 = "0.1.5"
