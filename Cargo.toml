[workspace]
members = [
    "crates/magnon-core",
    "crates/magnon-cli",
    "crates/magnon-node",
    "crates/magnon-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2021"
authors = ["Amin Fathullah <amin_fathullah@yahoo.com>"]
repository = "https://github.com/aminfathullah/magnon"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
